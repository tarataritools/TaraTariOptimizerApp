[package]
name = "tara-tari-optimizer"
version = "0.0.1"
edition = "2021"
description = "A cautious, native Windows maintenance utility"

[features]
default = ["admin-elevation"]
admin-elevation = []

[dependencies]
eframe = "0.31"
sysinfo = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
